name: Release desktop installers and ZIPs

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: pack:win
          - os: macos-latest
            platform: macos
            command: pack:mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Verify release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Release tag must match package version v${version}`);
          }
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run test:permissions
      - run: npm run ${{ matrix.command }}
      - name: Extract and verify Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem release/Mofang-*-windows-x64.zip)
          if ($archive.Count -ne 1) { throw 'Expected exactly one Windows ZIP' }
          $destination = Join-Path $env:RUNNER_TEMP 'mofang-zip-smoke'
          Expand-Archive -LiteralPath $archive[0].FullName -DestinationPath $destination
          npm run test:packaged -- "$destination/Mofang.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = @(Get-ChildItem release/Mofang-*-windows-x64-setup.exe)
          if ($installer.Count -ne 1 -or $installer[0].Length -lt 1MB) { throw 'Expected one Windows installer' }
      - name: Extract and verify macOS ZIP
        if: runner.os == 'macOS'
        run: |
          destination="$RUNNER_TEMP/mofang-zip-smoke"
          mkdir -p "$destination"
          ditto -x -k release/Mofang-*-macos-universal.zip "$destination"
          app="$destination/魔方数字资产管理.app"
          executable="$app/Contents/MacOS/魔方数字资产管理"
          lipo "$executable" -verify_arch x86_64 arm64
          lipo "$app/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" -verify_arch x86_64 arm64
          codesign --verify --deep --strict --verbose=2 "$app"
          npm run test:packaged -- "$executable"
          dmg=(release/Mofang-*-macos-universal.dmg)
          test "${#dmg[@]}" -eq 1
          hdiutil verify "${dmg[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            apps/desktop/release/Mofang-*.zip
            apps/desktop/release/Mofang-*.exe
            apps/desktop/release/Mofang-*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Generate checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd release
          version="${RELEASE_TAG#v}"
          test -f "Mofang-${version}-windows-x64.zip"
          test -f "Mofang-${version}-windows-x64-setup.exe"
          test -f "Mofang-${version}-macos-universal.zip"
          test -f "Mofang-${version}-macos-universal.dmg"
          sha256sum Mofang-*.zip Mofang-*.exe Mofang-*.dmg > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cp ../apps/desktop/packaging/使用说明.txt ./README.txt
          # Build and test both platforms before exposing any download.
          # An existing release is never overwritten by a rerun.
          gh release create "$RELEASE_TAG" Mofang-*.zip Mofang-*.exe Mofang-*.dmg SHA256SUMS.txt README.txt \
            --verify-tag --draft --title "魔方数字资产管理 ${RELEASE_TAG} · 安装包与免安装版" \
            --notes-file ../docs/releases/desktop-zip.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
